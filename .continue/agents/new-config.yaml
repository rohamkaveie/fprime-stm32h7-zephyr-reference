# Continue Configuration for Local Qwen via Ollama
models:
  - name: "Qwen 2.5 Coder 7B"
    provider: "ollama"
    model: "qwen2.5-coder:7b"
    apiBase: "http://localhost:11434"
    title: "Qwen 2.5 Coder 7B (Chat & Edit)"
    roles:
      - chat
      - edit
      - apply

tabAutocompleteModel:
  title: "Qwen 1.5B Autocomplete"
  provider: "ollama"
  model: "qwen2.5-coder:1.5b-base"
  apiBase: "http://localhost:11434"

# Autocomplete behavior settings optimized for C++ / Embedded
tabAutocompleteOptions:
  useDebounce: true
  debounceDelay: 250
  maxPromptTokens: 1024
  prefixPercentage: 0.5

# Embeddings model for codebase search (@codebase indexing)
embeddingsProvider:
  provider: "ollama"
  model: "nomic-embed-text"
  apiBase: "http://localhost:11434"
